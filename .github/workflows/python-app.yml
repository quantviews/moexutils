name: Python CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,reference]"
      - name: Check dependencies
        run: |
          python -m pip check
          python -c "import numpy, pyarrow, polars, duckdb; print({m.__name__: m.__version__ for m in (numpy, pyarrow, polars, duckdb)})"
          python -c "from zoneinfo import ZoneInfo, reset_tzpath; reset_tzpath([]); print([str(ZoneInfo(z)) for z in ('UTC', 'Europe/Moscow', 'America/New_York')])"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
